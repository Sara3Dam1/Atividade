<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Controle de Estoque</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="header">
        <h1>Controle de Estoque</h1>
        <button id="logoutBtn" class="btn-secondary">Sair</button>
    </div>

    <div class="container">
        <nav class="sidebar">
            <ul>
                <li><a href="#" onclick="showSection('dashboard')">Dashboard</a></li>
                <li><a href="#" onclick="showSection('categorias')">Categorias</a></li>
                <li><a href="#" onclick="showSection('produtos')">Produtos</a></li>
                <li><a href="#" onclick="showSection('movimentacoes')">Movimentações</a></li>
            </ul>
        </nav>

        <main class="content">
            <!-- Dashboard -->
            <section id="dashboard" class="section active">
                <h2>Dashboard</h2>
                <div class="dashboard-grid">
                    <div class="card">
                        <h3>Total de Produtos</h3>
                        <p id="totalProducts">0</p>
                    </div>
                    <div class="card">
                        <h3>Total de Categorias</h3>
                        <p id="totalCategories">0</p>
                    </div>
                    <div class="card">
                        <h3>Movimentações Recentes</h3>
                        <p id="recentMovements">0</p>
                    </div>
                </div>
            </section>

            <!-- Categorias -->
            <section id="categorias" class="section">
                <h2>Categorias</h2>
                <button class="btn-primary" onclick="showForm('category')">+ Nova Categoria</button>
                <table id="categoriesTable" class="table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </section>

            <!-- Produtos -->
            <section id="produtos" class="section">
                <h2>Produtos</h2>
                <button class="btn-primary" onclick="showForm('product')">+ Novo Produto</button>
                <table id="productsTable" class="table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>Categoria</th>
                            <th>Preço</th>
                            <th>Quantidade</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </section>

            <!-- Movimentações -->
            <section id="movimentacoes" class="section">
                <h2>Movimentações</h2>
                <button class="btn-primary" onclick="showForm('movement')">+ Nova Movimentação</button>
                <table id="movementsTable" class="table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Produto</th>
                            <th>Tipo</th>
                            <th>Quantidade</th>
                            <th>Data</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </section>
        </main>
    </div>

    <!-- Modal de Formulário -->
    <div id="formModal" class="modal" style="display:none;">
        <div class="modal-content">
            <span class="close" onclick="closeForm()">&times;</span>
            <form id="dataForm">
                <div id="formFields"></div>
                <button type="submit" class="btn-primary">Salvar</button>
                <button type="button" class="btn-secondary" onclick="closeForm()">Cancelar</button>
            </form>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
